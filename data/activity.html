<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade feed</title>

<style>
  :root {
    color-scheme: light;
    --ground:      #f4f6f8;
    --surface:     #ffffff;
    --surface-alt: #eef1f4;
    --ink:         #151a1f;
    --ink-2:       #5a646e;
    --ink-3:       #8b959f;
    --rule:        #dde2e7;
    --rule-strong: #c4ccd4;
    --accent:      #2a78d6;
    --accent-soft: #dfebfa;
    --violet:      #4a3aa7;
    --orange:      #c04f22;
    --aqua:        #157f5a;
    --bar:         #b9d3f0;
    /* Trade direction. Three redundant encodings, because at 10.5px hue alone
       does not separate: fill vs tint for intensity, hue for direction, and an
       arrow glyph that works with no colour at all. */
    --pos-new-bg:  #0b6b46;  --pos-new-fg:  #ffffff;
    --pos-buy-bg:  #d5eee2;  --pos-buy-fg:  #0a5c3c;
    --pos-sell-bg: #fbe0d2;  --pos-sell-fg: #8c3813;
    --pos-exit-bg: #9c3a18;  --pos-exit-fg: #ffffff;
    --pos1-bg: #12508f;  --pos1-fg: #ffffff;
    --pos2-bg: #2f6fb8;  --pos2-fg: #ffffff;
    --pos3-bg: #b9d5f0;  --pos3-fg: #123a63;
    --pos4-bg: #e7eef5;  --pos4-fg: #4a5560;

    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans:  ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono:  ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground:      #101418;
      --surface:     #171c21;
      --surface-alt: #1e242a;
      --ink:         #e9edf1;
      --ink-2:       #9aa5af;
      --ink-3:       #6d7883;
      --rule:        #262d34;
      --rule-strong: #3a434c;
      --accent:      #3987e5;
      --accent-soft: #1b2c42;
      --violet:      #9085e9;
      --orange:      #e0763f;
      --aqua:        #35b98a;
      --bar:         #2c4d73;
      --pos-new-bg:  #35b98a;  --pos-new-fg:  #06231a;
      --pos-buy-bg:  #1b4234;  --pos-buy-fg:  #7fe0b6;
      --pos-sell-bg: #4a2818;  --pos-sell-fg: #f0a077;
      --pos-exit-bg: #e0763f;  --pos-exit-fg: #1c0d05;

      --pos1-bg: #6aa9ea;  --pos1-fg: #0b1620;
      --pos2-bg: #2f6fb8;  --pos2-fg: #ffffff;
      --pos3-bg: #27435f;  --pos3-fg: #cfe0f2;
      --pos4-bg: #232a31;  --pos4-fg: #8a949e;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground:      #101418;
    --surface:     #171c21;
    --surface-alt: #1e242a;
    --ink:         #e9edf1;
    --ink-2:       #9aa5af;
    --ink-3:       #6d7883;
    --rule:        #262d34;
    --rule-strong: #3a434c;
    --accent:      #3987e5;
    --accent-soft: #1b2c42;
    --violet:      #9085e9;
    --orange:      #e0763f;
    --aqua:        #35b98a;
    --bar:         #2c4d73;
    --pos1-bg: #6aa9ea;  --pos1-fg: #0b1620;
    --pos2-bg: #2f6fb8;  --pos2-fg: #ffffff;
    --pos3-bg: #27435f;  --pos3-fg: #cfe0f2;
    --pos4-bg: #232a31;  --pos4-fg: #8a949e;
    --pos-new-bg:  #35b98a;  --pos-new-fg:  #06231a;
    --pos-buy-bg:  #1b4234;  --pos-buy-fg:  #7fe0b6;
    --pos-sell-bg: #4a2818;  --pos-sell-fg: #f0a077;
    --pos-exit-bg: #e0763f;  --pos-exit-fg: #1c0d05;
  }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* ---- masthead ---- */

  .masthead { display: flex; flex-direction: column; gap: 10px; }

  .masthead-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .langswitch { display: flex; gap: 0; }
  .langswitch button {
    font: inherit;
    font-size: 12px;
    font-family: var(--mono);
    /* Two characters wide, and it must stay that way: on a narrow screen the
       nav takes the row and "中文" would otherwise break across two lines. */
    white-space: nowrap;
    padding: 5px 11px;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    cursor: pointer;
  }
  .langswitch button:first-child { border-radius: 3px 0 0 3px; }
  .langswitch button:last-child { border-radius: 0 3px 3px 0; border-left: none; }
  .langswitch button[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
    font-weight: 600;
  }
  .langswitch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---- site nav ---- */

  /* Every page carries the same nav, so the current page is marked rather than
     omitted -- a missing item reads as a broken link, not as "you are here". */
  .sitenav { display: flex; flex-wrap: wrap; gap: 4px; }
  .sitenav a {
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 11px;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    text-decoration: none;
    white-space: nowrap;
  }
  .sitenav a:hover { border-color: var(--accent); color: var(--ink); }
  .sitenav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sitenav a[aria-current="page"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
    font-weight: 600;
  }

  /* ---- trade direction chip ---- */

  /* Shared by the feed and the home page. Solid for opening and closing,
     tinted for adding and trimming: the fill carries intensity, the hue
     carries direction, and the arrow works with no colour at all. */
  .tag-action {
    justify-self: start;
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .tag-action[data-k="new"]  { background: var(--pos-new-bg);  color: var(--pos-new-fg); }
  .tag-action[data-k="buy"]  { background: var(--pos-buy-bg);  color: var(--pos-buy-fg); }
  .tag-action[data-k="sell"] { background: var(--pos-sell-bg); color: var(--pos-sell-fg); }
  .tag-action[data-k="exit"] { background: var(--pos-exit-bg); color: var(--pos-exit-fg); }
  .tag-action .arrow { font-size: 9px; opacity: 0.85; }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
  }

  h1 {
    font-family: var(--serif);
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 600;
    line-height: 1.12;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }

  .standfirst {
    color: var(--ink-2);
    max-width: 62ch;
    margin: 0;
    font-size: 14.5px;
  }

  .provenance {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-3);
    border-top: 1px solid var(--rule);
    padding-top: 10px;
    margin-top: 4px;
  }

  /* ---- summary tiles ---- */

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 3px;
    overflow: hidden;
  }

  .tile {
    background: var(--surface);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .tile-label {
    font-size: 10.5px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
  }

  .tile-value {
    font-family: var(--mono);
    font-size: 21px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .tile-note { font-size: 12px; color: var(--ink-2); }

  /* ---- fund strip ---- */

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  h2 {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 600;
    margin: 0;
  }

  .hint { font-size: 12.5px; color: var(--ink-3); }

  .scroller { overflow-x: auto; }

  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }

  thead th {
    text-align: left;
    font-size: 10.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
    padding: 9px 12px;
    border-bottom: 1px solid var(--rule-strong);
    white-space: nowrap;
    background: var(--surface);
  }

  tbody td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule);
    vertical-align: baseline;
  }

  .num {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
    white-space: nowrap;
  }

  .fundtable {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    max-width: 660px;
  }
  .fundtable td:first-child, .fundtable th:first-child { padding-left: 18px; }
  .fundtable td:last-child, .fundtable th:last-child { padding-right: 18px; }
  .fundtable tbody tr:last-child td { border-bottom: none; font-weight: 600; }
  .fundtable tbody tr:last-child td { border-top: 1px solid var(--rule-strong); }
  .ticker-cell { font-family: var(--mono); font-weight: 600; }

  /* ---- controls ---- */

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  .search {
    flex: 1 1 220px;
    min-width: 180px;
    font: inherit;
    font-size: 14px;
    padding: 8px 12px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
  }
  .search::placeholder { color: var(--ink-3); }
  .search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .chipset { display: flex; flex-wrap: wrap; gap: 6px; }

  .filterbar {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .filter-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .filter-groups {
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-top: 1px solid var(--rule);
    padding-top: 12px;
  }

  .filter-row {
    display: grid;
    grid-template-columns: 116px 1fr;
    gap: 12px;
    align-items: start;
  }

  .filter-label {
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
    padding-top: 7px;
  }

  .chip .count {
    color: var(--ink-3);
    font-weight: 400;
    margin-left: 5px;
  }
  .chip[aria-pressed="true"] .count { color: var(--ink-2); }
  .chip[data-empty="1"] { opacity: 0.4; }

  .clear {
    font: inherit;
    font-size: 12px;
    padding: 6px 10px;
    color: var(--ink-2);
    background: transparent;
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    cursor: pointer;
  }
  .clear:hover { border-color: var(--accent); color: var(--ink); }
  .clear:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  @media (max-width: 720px) {
    .filter-row { grid-template-columns: 1fr; gap: 4px; }
    .filter-label { padding-top: 0; }
  }

  .chip {
    font: inherit;
    font-size: 12px;
    font-family: var(--mono);
    padding: 6px 10px;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--ink); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chip[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
    font-weight: 600;
  }

  /* ---- holdings table ---- */

  /* A capped height makes the container the vertical scroller, which is what
     the sticky header sticks to; without it `top: 0` has nothing to act on. */
  /* The height cap is what makes the sticky header work: `overflow: auto` is
     needed for the horizontal scroll of a wide table, and that same property
     makes this the scroll container the header sticks inside. Remove the cap
     and the header sticks to the top of an unbounded box, which is off screen
     -- so row 250 of the leaderboard would have no column names. 85vh rather
     than the old 74vh because the masthead has scrolled away by the time the
     table is in use, so the reserved space was being wasted. */
  .holdings-wrap {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    overflow: auto;
    max-height: 85vh;
  }

  /* On a phone the nested scroll costs more than the sticky header buys: the
     inner box swallows the swipe that was meant to move the page. One scroll
     container, and the header scrolls away with everything else. */
  @media (max-width: 720px) {
    .holdings-wrap { max-height: none; }
  }

  #holdings { font-size: 13px; min-width: 1190px; }
  #holdings thead th { position: sticky; top: 0; z-index: 2; }
  #holdings th.sortable { cursor: pointer; user-select: none; }
  #holdings th.sortable:hover { color: var(--ink); }
  #holdings th.sortable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #holdings th .arrow { opacity: 0; margin-left: 3px; }
  #holdings th[data-dir] .arrow { opacity: 1; color: var(--accent); }
  #holdings td:first-child, #holdings th:first-child { padding-left: 18px; }
  #holdings td:last-child, #holdings th:last-child { padding-right: 18px; }

  .row-main { cursor: pointer; }
  .row-main:hover { background: var(--surface-alt); }
  .row-main:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row-main.open { background: var(--surface-alt); }

  /* Enough columns now that the browser would rather wrap the name than
     scroll; a floor keeps it on one or two lines and lets the wrapper scroll. */
  .name-cell { min-width: 236px; max-width: 340px; }
  .name { display: block; }
  .cusip {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
  }

  /* magnitude bar sits behind the value, anchored to the right edge */
  .mv-cell { position: relative; }
  .mv-inner {
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 8px;
  }

  /* Order-of-magnitude badge on ARK's position. A single hue stepped
     light-to-dark, because size is ordinal -- categorical colours would imply
     these tiers are unrelated kinds rather than a scale. The tier is spelled
     out on the badge so it never depends on colour alone. */
  .mv-tier {
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1.5;
    letter-spacing: 0.02em;
    padding: 1px 5px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .mv-tier[data-t="p1"] { background: var(--pos1-bg); color: var(--pos1-fg); }
  .mv-tier[data-t="p2"] { background: var(--pos2-bg); color: var(--pos2-fg); }
  .mv-tier[data-t="p3"] { background: var(--pos3-bg); color: var(--pos3-fg); }
  .mv-tier[data-t="p4"] { background: var(--pos4-bg); color: var(--pos4-fg); }

  .mv-bar {
    position: absolute;
    right: 12px;
    bottom: 3px;
    height: 3px;
    border-radius: 0 0 0 0;
    background: var(--bar);
  }
  .mv-val { position: relative; }

  .tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.03em;
    padding: 2px 6px;
    border-radius: 2px;
    border: 1px solid currentColor;
    white-space: nowrap;
  }
  .tag[data-i="0"] { color: var(--ink-3); }
  .tag[data-i="1"] { color: var(--violet); }
  .tag[data-i="2"] { color: var(--orange); }
  .tag[data-i="3"] { color: var(--aqua); }

  .price-cell { font-family: var(--mono); font-variant-numeric: tabular-nums;
                text-align: right; white-space: nowrap; }

  /* 52-week range: a track spanning low..high with the last price marked. */
  .range { display: flex; flex-direction: column; gap: 3px; min-width: 104px; }
  .range-track {
    position: relative;
    height: 4px;
    border-radius: 2px;
    background: var(--rule-strong);
  }
  .range-mark {
    position: absolute;
    top: -2px;
    width: 3px;
    height: 8px;
    border-radius: 1px;
    background: var(--accent);
    transform: translateX(-1.5px);
  }
  .range-ends {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-3);
    gap: 8px;
  }

  .funds-cell { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }

  .detail td { background: var(--surface-alt); border-bottom: 1px solid var(--rule-strong); }
  .detail-desc {
    margin: 0;
    /* Fills the detail row instead of wrapping three times in a narrow column,
       but stays under the table's min-width: an auto-layout table grows to fit
       its widest cell, so an unbounded line here stretches the whole table and
       pushes the last columns out of view. */
    max-width: 1080px;
    padding-right: 24px;
    font-size: 13.5px;
    /* Chinese needs the looser leading; it reads cramped at English spacing. */
    line-height: 1.7;
    color: var(--ink);
    /* Stops a one-word last line -- "software." was orphaning on its own row. */
    text-wrap: pretty;
    line-break: strict;
    overflow-wrap: break-word;
  }

  .detail-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.02em;
  }

  .detail-body {
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 10px 0 12px;
  }

  .detail-links { display: flex; flex-wrap: wrap; gap: 6px; }
  .detail-links a {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 8px;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    text-decoration: none;
    white-space: nowrap;
  }
  .detail-links a:hover { border-color: var(--accent); color: var(--accent); }
  .detail-links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .detail-links a::after { content: " ↗"; opacity: 0.45; }

  .fin-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 22px;
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
  }
  .fin-row b { color: var(--ink); font-weight: 600; }
  .fin-row .neg { color: var(--orange); }
  .fin-row .warn { color: var(--ink-3); font-style: italic; }

  .detail-inner {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 22px;
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .detail-inner span { color: var(--ink-2); }
  .detail-inner b { color: var(--ink); font-weight: 600; }

  .empty { padding: 28px 18px; color: var(--ink-2); font-size: 14px; }

  .status {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }

  footer {
    border-top: 1px solid var(--rule);
    padding-top: 16px;
    font-size: 12.5px;
    color: var(--ink-2);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  footer b { color: var(--ink); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }


/* ---- activity feed ---- */

.daygroup { display: flex; flex-direction: column; }

.dayhead {
  position: sticky;
  top: 0;
  z-index: 3;
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding: 9px 18px;
  background: var(--surface-alt);
  border-bottom: 1px solid var(--rule-strong);
  border-top: 1px solid var(--rule-strong);
  font-family: var(--mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.dayhead .date { font-weight: 600; color: var(--ink); }
.dayhead .tally { color: var(--ink-3); font-size: 11px; }

.move {
  display: grid;
  grid-template-columns: 74px 82px minmax(200px, 1fr) 120px 118px 150px;
  gap: 14px;
  align-items: baseline;
  padding: 9px 18px;

:0},{"d":"2026-06-17","buy":9,"sell":6,"new":1,"exit":0}]};

const LANGS = DATA.langs.map(l => l.v);
let lang = (() => {
  try { const v = localStorage.getItem('ark-lang'); if (LANGS.includes(v)) return v; }
  catch (e) {}
  return LANGS[0];
})();
const page = () => DATA.i18n[lang];
const t = k => page().ui[k];
const lbl = o => (lang === 'zh' && o.label_zh) ? o.label_zh : o.label;
const desc = e => (lang === 'zh' && e.dz) ? e.dz : (e.ds || '');

const HERE = 'activity';
/* The shared site nav, inlined into every page by shell.py.

   Labels come from page().nav so they follow the language switch, and each
   template declares its own `HERE` so the current page can be marked rather
   than dropped -- a missing entry reads as a broken link, not as "you are
   here".

   The newest report is served both as holdings.html and as its dated copy
   under reports/, from the same bytes, so the depth cannot be baked into the
   href; it is read off the path instead. */

const NAV_BASE = location.pathname.includes('/reports/') ? '../' : '';
const NAV_PAGES = ['index', 'holdings', 'activity', 'leaders', 'manager', 'archive'];

function paintNav() {
  const el = document.getElementById('sitenav');
  if (!el) return;
  const labels = page().nav || {};
  el.innerHTML = NAV_PAGES.map(k =>
    `<a href="${NAV_BASE}${k}.html"${k === HERE ? ' aria-current="page"' : ''}>` +
    `${labels[k] || k}</a>`).join('');
}


document.body.classList.toggle('single', !!DATA.single);

const usd = n => n.toLocaleString('en-US', {maximumFractionDigits: 0});
function money(v) {
  const a = Math.abs(v);
  const [div, suf] = a >= 1e9 ? [1e9, 'B'] : a >= 1e6 ? [1e6, 'M'] : a >= 1e3 ? [1e3, 'K'] : [1, ''];
  return '$' + (a / div).toFixed(a / div >= 100 ? 0 : 1) + suf;
}

// A single filer cannot agree with itself, so those two dimensions are left
// out rather than offered and permanently empty.
const GROUPS = [
  {key: 'kind', label: 'Action', label_zh: '动作', options: DATA.kinds},
  ...(DATA.single ? [] : [
    {key: 'fund', label: 'Fund', label_zh: '基金', options: DATA.funds},
    {key: 'agree', label: 'Agreement', label_zh: '一致性', options: [
      {v: '2', label: '2+ funds', label_zh: '2 只以上'},
      {v: '3', label: '3+ funds', label_zh: '3 只以上'},
    ]},
  ]),
];

const state = {q: '', sel: {}, open: new Set()};
GROUPS.forEach(g => { state.sel[g.key] = new Set(); });

function matchesGroup(e, g) {
  const chosen = state.sel[g.key];
  if (!chosen.size) return true;
  if (g.key === 'kind') return chosen.has(e.k);
  if (g.key === 'fund') return e.f.some(f => chosen.has(f));
  // Agreement is a floor, not a set: picking 2+ and 3+ means the looser one.
  const floor = Math.min(...[...chosen].map(Number));
  return e.f.length >= floor;
}
const matchesSearch = e =>
  !state.q || ((e.t || '') + ' ' + e.n).toLowerCase().includes(state.q);

const visible = () =>
  DATA.events.filter(e => matchesSearch(e) && GROUPS.every(g => matchesGroup(e, g)));

function countFor(g, v) {
  return DATA.events.filter(e => {
    if (!matchesSearch(e)) return false;
    for (const o of GROUPS) if (o.key !== g.key && !matchesGroup(e, o)) return false;
    if (g.key === 'kind') return e.k === v;
    if (g.key === 'fund') return e.f.includes(v);
    return e.f.length >= Number(v);
  }).length;
}

const groupsEl = document.getElementById('filter-groups');
groupsEl.innerHTML = GROUPS.map(g => `
  <div class="filter-row">
    <div class="filter-label" id="lbl-${g.key}">${lbl(g)}</div>
    <div class="chipset" role="group" aria-labelledby="lbl-${g.key}" data-group="${g.key}">
      ${g.options.map(o => `<button class="chip" type="button" data-v="${o.v}"
        aria-pressed="false">${lbl(o)}<span class="count"></span></button>`).join('')}
    </div>
  </div>`).join('');

groupsEl.addEventListener('click', ev => {
  const btn = ev.target.closest('.chip');
  if (!btn) return;
  const key = btn.closest('[data-group]').dataset.group;
  const bucket = state.sel[key];
  const v = btn.dataset.v;
  if (bucket.has(v)) bucket.delete(v); else bucket.add(v);
  render();
});

const clearBtn = document.getElementById('clear');
clearBtn.addEventListener('click', () => {
  GROUPS.forEach(g => state.sel[g.key].clear());
  state.q = '';
  document.getElementById('search').value = '';
  render();
});
document.getElementById('search').addEventListener('input', ev => {
  state.q = ev.target.value.trim().toLowerCase();
  render();
});

const switcher = document.getElementById('langswitch');
switcher.innerHTML = DATA.langs.map(l =>
  `<button type="button" data-l="${l.v}" aria-pressed="false">${l.label}</button>`).join('');
switcher.addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b || b.dataset.l === lang) return;
  lang = b.dataset.l;
  try { localStorage.setItem('ark-lang', lang); } catch (err) {}
  paintStatic();
  render();
});

function paintStatic() {
  const c = page();
  paintNav();
  document.getElementById('eyebrow').textContent = c.eyebrow;
  document.getElementById('title').textContent = c.title;
  document.getElementById('standfirst').textContent = c.standfirst;
  document.getElementById('provenance').textContent = c.provenance;
  document.getElementById('clear').textContent = t('clear');
  document.getElementById('empty').textContent = t('empty');
  document.getElementById('search').placeholder = t('search');
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  // The tab title follows the source and the language; the static one in the
  // markup is only what shows before this runs.
  document.title = c.title;

  document.getElementById('tiles').innerHTML = c.tiles.map(([l, v, n]) => `
    <div class="tile">
      <span class="tile-label">${l}</span>
      <span class="tile-value">${v}</span>
      <span class="tile-note">${n}</span>
    </div>`).join('');
  document.getElementById('footnotes').innerHTML = c.footnotes
    .map(([b, x]) => `<div>${b ? `<b>${b}</b> ` : ''}${x}</div>`).join('');

  document.getElementById('feedhead').innerHTML = `
    <span>${t('colDate')}</span><span>${t('colAction')}</span>
    <span>${t('colCompany')}</span><span class="r">${t('colShares')}</span>
    <span class="r">${t('colValue')}</span>
    <span>${DATA.single ? '' : t('colFunds')}</span>`;

  document.querySelectorAll('#filter-groups .filter-label').forEach(el => {
    const g = GROUPS.find(x => x.key === el.id.slice(4));
    if (g) el.textContent = lbl(g);
  });
  document.querySelectorAll('#filter-groups .chip').forEach(btn => {
    const g = GROUPS.find(x => x.key === btn.closest('[data-group]').dataset.group);
    const o = g && g.options.find(x => String(x.v) === btn.dataset.v);
    if (o) btn.childNodes[0].nodeValue = lbl(o);
  });
}

function paintChips() {
  let active = 0;
  GROUPS.forEach(g => {
    active += state.sel[g.key].size;
    const wrap = groupsEl.querySelector(`[data-group="${g.key}"]`);
    g.options.forEach(o => {
      const btn = wrap.querySelector(`[data-v="${CSS.escape(o.v)}"]`);
      const n = countFor(g, o.v);
      btn.setAttribute('aria-pressed', state.sel[g.key].has(o.v) ? 'true' : 'false');
      btn.dataset.empty = (!state.sel[g.key].has(o.v) && n === 0) ? '1' : '0';
      btn.querySelector('.count').textContent = n;
    });
  });
  clearBtn.hidden = active === 0 && !state.q;
}

const SITE_LABEL = {};
(DATA.sites || []).forEach(x => { SITE_LABEL[x.key] = x; });
const siteLinks = e => !e.lk ? '' :
  `<div class="detail-links">${e.lk.map(l => {
    const s = SITE_LABEL[l.k];
    return s ? `<a href="${l.u}" target="_blank" rel="noopener noreferrer">${lbl(s)}</a>` : '';
  }).join('')}</div>`;

const KIND_LABEL = k => t(k);
const ARROW = {new: '\u25b2', buy: '\u25b2', sell: '\u25bc', exit: '\u25bc'};

function render() {
  paintChips();
  const rows = visible();
  const days = new Set(rows.map(e => e.d));

  document.getElementById('status').textContent = t('status')
    .replace('{n}', rows.length).replace('{t}', DATA.events.length)
    .replace('{d}', days.size);

  const byDay = new Map();
  rows.forEach(e => {
    if (!byDay.has(e.d)) byDay.set(e.d, []);
    byDay.get(e.d).push(e);
  });

  const html = [...byDay.entries()].map(([day, list]) => {
    const tally = ['new', 'buy', 'sell', 'exit']
      .map(k => [k, list.filter(e => e.k === k).length])
      .filter(([, n]) => n)
      .map(([k, n]) => `${KIND_LABEL(k)} ${n}`).join('  ·  ');
    const moves = list.map(e => {
      const open = state.open.has(e.d + e.c + e.k);
      const many = e.f.length >= DATA.conviction;
      return `
      <div class="move${many ? ' agree' : ''}" data-id="${e.d + e.c + e.k}"
           tabindex="0" role="button" aria-expanded="${open}">
        <span class="num" style="text-align:left">${e.d.slice(5)}</span>
        <span class="tag-action" data-k="${e.k}"><span class="arrow"
          >${ARROW[e.k]}</span>${KIND_LABEL(e.k)}</span>
        <span><span class="tick">${e.t || '—'}</span> <span class="co">${e.n}</span></span>
        <span class="num">${usd(Math.abs(e.s))}</span>
        <span class="num">${e.v ? money(e.v) : '—'}</span>
        ${DATA.single ? '<span></span>' : `<span class="fundlist"><span
          class="fundcount">${e.f.length}</span> ${e.f.join(' ')}</span>`}
      </div>
      ${open ? `<div class="movedetail">
        ${desc(e) ? `<p class="detail-desc">${desc(e)}</p>` : ''}
        ${siteLinks(e)}
      </div>` : ''}`;
    }).join('');
    return `<div class="daygroup">
      <div class="dayhead"><span class="date">${day}</span>
        <span class="tally">${tally}</span></div>
      ${moves}
    </div>`;
  }).join('');

  document.getElementById('feed').innerHTML = html;
  document.getElementById('empty').hidden = rows.length > 0;
}

document.getElementById('feed').addEventListener('click', ev => {
  const row = ev.target.closest('.move');
  if (!row || ev.target.closest('a')) return;
  const id = row.dataset.id;
  if (state.open.has(id)) state.open.delete(id); else state.open.add(id);
  render();
});
document.getElementById('feed').addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  const row = ev.target.closest('.move');
  if (!row) return;
  ev.preventDefault();
  const id = row.dataset.id;
  if (state.open.has(id)) state.open.delete(id); else state.open.add(id);
  render();
});

paintStatic();
render();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARK — daily brief</title>

<style>
  :root {
    color-scheme: light;
    --ground:      #f4f6f8;
    --surface:     #ffffff;
    --surface-alt: #eef1f4;
    --ink:         #151a1f;
    --ink-2:       #5a646e;
    --ink-3:       #8b959f;
    --rule:        #dde2e7;
    --rule-strong: #c4ccd4;
    --accent:      #2a78d6;
    --accent-soft: #dfebfa;
    --violet:      #4a3aa7;
    --orange:      #c04f22;
    --aqua:        #157f5a;
    --bar:         #b9d3f0;
    /* Trade direction. Three redundant encodings, because at 10.5px hue alone
       does not separate: fill vs tint for intensity, hue for direction, and an
       arrow glyph that works with no colour at all. */
    --pos-new-bg:  #0b6b46;  --pos-new-fg:  #ffffff;
    --pos-buy-bg:  #d5eee2;  --pos-buy-fg:  #0a5c3c;
    --pos-sell-bg: #fbe0d2;  --pos-sell-fg: #8c3813;
    --pos-exit-bg: #9c3a18;  --pos-exit-fg: #ffffff;
    --pos1-bg: #12508f;  --pos1-fg: #ffffff;
    --pos2-bg: #2f6fb8;  --pos2-fg: #ffffff;
    --pos3-bg: #b9d5f0;  --pos3-fg: #123a63;
    --pos4-bg: #e7eef5;  --pos4-fg: #4a5560;

    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans:  ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono:  ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground:      #101418;
      --surface:     #171c21;
      --surface-alt: #1e242a;
      --ink:         #e9edf1;
      --ink-2:       #9aa5af;
      --ink-3:       #6d7883;
      --rule:        #262d34;
      --rule-strong: #3a434c;
      --accent:      #3987e5;
      --accent-soft: #1b2c42;
      --violet:      #9085e9;
      --orange:      #e0763f;
      --aqua:        #35b98a;
      --bar:         #2c4d73;
      --pos-new-bg:  #35b98a;  --pos-new-fg:  #06231a;
      --pos-buy-bg:  #1b4234;  --pos-buy-fg:  #7fe0b6;
      --pos-sell-bg: #4a2818;  --pos-sell-fg: #f0a077;
      --pos-exit-bg: #e0763f;  --pos-exit-fg: #1c0d05;

      --pos1-bg: #6aa9ea;  --pos1-fg: #0b1620;
      --pos2-bg: #2f6fb8;  --pos2-fg: #ffffff;
      --pos3-bg: #27435f;  --pos3-fg: #cfe0f2;
      --pos4-bg: #232a31;  --pos4-fg: #8a949e;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground:      #101418;
    --surface:     #171c21;
    --surface-alt: #1e242a;
    --ink:         #e9edf1;
    --ink-2:       #9aa5af;
    --ink-3:       #6d7883;
    --rule:        #262d34;
    --rule-strong: #3a434c;
    --accent:      #3987e5;
    --accent-soft: #1b2c42;
    --violet:      #9085e9;
    --orange:      #e0763f;
    --aqua:        #35b98a;
    --bar:         #2c4d73;
    --pos1-bg: #6aa9ea;  --pos1-fg: #0b1620;
    --pos2-bg: #2f6fb8;  --pos2-fg: #ffffff;
    --pos3-bg: #27435f;  --pos3-fg: #cfe0f2;
    --pos4-bg: #232a31;  --pos4-fg: #8a949e;
    --pos-new-bg:  #35b98a;  --pos-new-fg:  #06231a;
    --pos-buy-bg:  #1b4234;  --pos-buy-fg:  #7fe0b6;
    --pos-sell-bg: #4a2818;  --pos-sell-fg: #f0a077;
    --pos-exit-bg: #e0763f;  --pos-exit-fg: #1c0d05;
  }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* ---- masthead ---- */

  .masthead { display: flex; flex-direction: column; gap: 10px; }

  .masthead-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .langswitch { display: flex; gap: 0; }
  .langswitch button {
    font: inherit;
    font-size: 12px;
    font-family: var(--mono);
    /* Two characters wide, and it must stay that way: on a narrow screen the
       nav takes the row and "中文" would otherwise break across two lines. */
    white-space: nowrap;
    padding: 5px 11px;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    cursor: pointer;
  }
  .langswitch button:first-child { border-radius: 3px 0 0 3px; }
  .langswitch button:last-child { border-radius: 0 3px 3px 0; border-left: none; }
  .langswitch button[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
    font-weight: 600;
  }
  .langswitch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---- site nav ---- */

  /* Every page carries the same nav, so the current page is marked rather than
     omitted -- a missing item reads as a broken link, not as "you are here". */
  .sitenav { display: flex; flex-wrap: wrap; gap: 4px; }
  .sitenav a {
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 11px;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    text-decoration: none;
    white-space: nowrap;
  }
  .sitenav a:hover { border-color: var(--accent); color: var(--ink); }
  .sitenav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sitenav a[aria-current="page"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
    font-weight: 600;
  }

  /* ---- trade direction chip ---- */

  /* Shared by the feed and the home page. Solid for opening and closing,
     tinted for adding and trimming: the fill carries intensity, the hue
     carries direction, and the arrow works with no colour at all. */
  .tag-action {
    justify-self: start;
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .tag-action[data-k="new"]  { background: var(--pos-new-bg);  color: var(--pos-new-fg); }
  .tag-action[data-k="buy"]  { background: var(--pos-buy-bg);  color: var(--pos-buy-fg); }
  .tag-action[data-k="sell"] { background: var(--pos-sell-bg); color: var(--pos-sell-fg); }
  .tag-action[data-k="exit"] { background: var(--pos-exit-bg); color: var(--pos-exit-fg); }
  .tag-action .arrow { font-size: 9px; opacity: 0.85; }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
  }

  h1 {
    font-family: var(--serif);
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 600;
    line-height: 1.12;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }

  .standfirst {
    color: var(--ink-2);
    max-width: 62ch;
    margin: 0;
    font-size: 14.5px;
  }

  .provenance {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-3);
    border-top: 1px solid var(--rule);
    padding-top: 10px;
    margin-top: 4px;
  }

  /* ---- summary tiles ---- */

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 3px;
    overflow: hidden;
  }

  .tile {
    background: var(--surface);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .tile-label {
    font-size: 10.5px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
  }

  .tile-value {
    font-family: var(--mono);
    font-size: 21px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .tile-note { font-size: 12px; color: var(--ink-2); }

  /* ---- fund strip ---- */

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  h2 {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 600;
    margin: 0;
  }

  .hint { font-size: 12.5px; color: var(--ink-3); }

  .scroller { overflow-x: auto; }

  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }

  thead th {
    text-align: left;
    font-size: 10.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
    padding: 9px 12px;
    border-bottom: 1px solid var(--rule-strong);
    white-space: nowrap;
    background: var(--surface);
  }

  tbody td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule);
    vertical-align: baseline;
  }

  .num {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
    white-space: nowrap;
  }

  .fundtable {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    max-width: 660px;
  }
  .fundtable td:first-child, .fundtable th:first-child { padding-left: 18px; }
  .fundtable td:last-child, .fundtable th:last-child { padding-right: 18px; }
  .fundtable tbody tr:last-child td { border-bottom: none; font-weight: 600; }
  .fundtable tbody tr:last-child td { border-top: 1px solid var(--rule-strong); }
  .ticker-cell { font-family: var(--mono); font-weight: 600; }

  /* ---- controls ---- */

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  .search {
    flex: 1 1 220px;
    min-width: 180px;
    font: inherit;
    font-size: 14px;
    padding: 8px 12px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
  }
  .search::placeholder { color: var(--ink-3); }
  .search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .chipset { display: flex; flex-wrap: wrap; gap: 6px; }

  .filterbar {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .filter-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .filter-groups {
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-top: 1px solid var(--rule);
    padding-top: 12px;
  }

  .filter-row {
    display: grid;
    grid-template-columns: 116px 1fr;
    gap: 12px;
    align-items: start;
  }

  .filter-label {
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
    padding-top: 7px;
  }

  .chip .count {
    color: var(--ink-3);
    font-weight: 400;
    margin-left: 5px;
  }
  .chip[aria-pressed="true"] .count { color: var(--ink-2); }
  .chip[data-empty="1"] { opacity: 0.4; }

  .clear {
    font: inherit;
    font-size: 12px;
    padding: 6px 10px;
    color: var(--ink-2);
    background: transparent;
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    cursor: pointer;
  }
  .clear:hover { border-color: var(--accent); color: var(--ink); }
  .clear:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  @media (max-width: 720px) {
    .filter-row { grid-template-columns: 1fr; gap: 4px; }
    .filter-label { padding-top: 0; }
  }

  .chip {
    font: inherit;
    font-size: 12px;
    font-family: var(--mono);
    padding: 6px 10px;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--ink); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chip[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
    font-weight: 600;
  }

  /* ---- holdings table ---- */

  /* A capped height makes the container the vertical scroller, which is what
     the sticky header sticks to; without it `top: 0` has nothing to act on. */
  /* The height cap is what makes the sticky header work: `overflow: auto` is
     needed for the horizontal scroll of a wide table, and that same property
     makes this the scroll container the header sticks inside. Remove the cap
     and the header sticks to the top of an unbounded box, which is off screen
     -- so row 250 of the leaderboard would have no column names. 85vh rather
     than the old 74vh because the masthead has scrolled away by the time the
     table is in use, so the reserved space was being wasted. */
  .holdings-wrap {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    overflow: auto;
    max-height: 85vh;
  }

  /* On a phone the nested scroll costs more than the sticky header buys: the
     inner box swallows the swipe that was meant to move the page. One scroll
     container, and the header scrolls away with everything else. */
  @media (max-width: 720px) {
    .holdings-wrap { max-height: none; }
  }

  #holdings { font-size: 13px; min-width: 1190px; }
  #holdings thead th { position: sticky; top: 0; z-index: 2; }
  #holdings th.sortable { cursor: pointer; user-select: none; }
  #holdings th.sortable:hover { color: var(--ink); }
  #holdings th.sortable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #holdings th .arrow { opacity: 0; margin-left: 3px; }
  #holdings th[data-dir] .arrow { opacity: 1; color: var(--accent); }
  #holdings td:first-child, #holdings th:first-child { padding-left: 18px; }
  #holdings td:last-child, #holdings th:last-child { padding-right: 18px; }

  .row-main { cursor: pointer; }
  .row-main:hover { background: var(--surface-alt); }
  .row-main:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row-main.open { background: var(--surface-alt); }

  /* Enough columns now that the browser would rather wrap the name than
     scroll; a floor keeps it on one or two lines and lets the wrapper scroll. */
  .name-cell { min-width: 236px; max-width: 340px; }
  .name { display: block; }
  .cusip {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
  }

  /* magnitude bar sits behind the value, anchored to the right edge */
  .mv-cell { position: relative; }
  .mv-inner {
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 8px;
  }

  /* Order-of-magnitude badge on ARK's position. A single hue stepped
     light-to-dark, because size is ordinal -- categorical colours would imply
     these tiers are unrelated kinds rather than a scale. The tier is spelled
     out on the badge so it never depends on colour alone. */
  .mv-tier {
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1.5;
    letter-spacing: 0.02em;
    padding: 1px 5px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .mv-tier[data-t="p1"] { background: var(--pos1-bg); color: var(--pos1-fg); }
  .mv-tier[data-t="p2"] { background: var(--pos2-bg); color: var(--pos2-fg); }
  .mv-tier[data-t="p3"] { background: var(--pos3-bg); color: var(--pos3-fg); }
  .mv-tier[data-t="p4"] { background: var(--pos4-bg); color: var(--pos4-fg); }

  .mv-bar {
    position: absolute;
    right: 12px;
    bottom: 3px;
    height: 3px;
    border-radius: 0 0 0 0;
    background: var(--bar);
  }
  .mv-val { position: relative; }

  .tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.03em;
    padding: 2px 6px;
    border-radius: 2px;
    border: 1px solid currentColor;
    white-space: nowrap;
  }
  .tag[data-i="0"] { color: var(--ink-3); }
  .tag[data-i="1"] { color: var(--violet); }
  .tag[data-i="2"] { color: var(--orange); }
  .tag[data-i="3"] { color: var(--aqua); }

  .price-cell { font-family: var(--mono); font-variant-numeric: tabular-nums;
                text-align: right; white-space: nowrap; }

  /* 52-week range: a track spanning low..high with the last price marked. */
  .range { display: flex; flex-direction: column; gap: 3px; min-width: 104px; }
  .range-track {
    position: relative;
    height: 4px;
    border-radius: 2px;
    background: var(--rule-strong);
  }
  .range-mark {
    position: absolute;
    top: -2px;
    width: 3px;
    height: 8px;
    border-radius: 1px;
    background: var(--accent);
    transform: translateX(-1.5px);
  }
  .range-ends {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-3);
    gap: 8px;
  }

  .funds-cell { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }

  .detail td { background: var(--surface-alt); border-bottom: 1px solid var(--rule-strong); }
  .detail-desc {
    margin: 0;
    /* Fills the detail row instead of wrapping three times in a narrow column,
       but stays under the table's min-width: an auto-layout table grows to fit
       its widest cell, so an unbounded line here stretches the whole table and
       pushes the last columns out of view. */
    max-width: 1080px;
    padding-right: 24px;
    font-size: 13.5px;
    /* Chinese needs the looser leading; it reads cramped at English spacing. */
    line-height: 1.7;
    color: var(--ink);
    /* Stops a one-word last line -- "software." was orphaning on its own row. */
    text-wrap: pretty;
    line-break: strict;
    overflow-wrap: break-word;
  }

  .detail-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.02em;
  }

  .detail-body {
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 10px 0 12px;
  }

  .detail-links { display: flex; flex-wrap: wrap; gap: 6px; }
  .detail-links a {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 8px;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    text-decoration: none;
    white-space: nowrap;
  }
  .detail-links a:hover { border-color: var(--accent); color: var(--accent); }
  .detail-links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .detail-links a::after { content: " ↗"; opacity: 0.45; }

  .fin-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 22px;
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
  }
  .fin-row b { color: var(--ink); font-weight: 600; }
  .fin-row .neg { color: var(--orange); }
  .fin-row .warn { color: var(--ink-3); font-style: italic; }

  .detail-inner {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 22px;
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .detail-inner span { color: var(--ink-2); }
  .detail-inner b { color: var(--ink); font-weight: 600; }

  .empty { padding: 28px 18px; color: var(--ink-2); font-size: 14px; }

  .status {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }

  footer {
    border-top: 1px solid var(--rule);
    padding-top: 16px;
    font-size: 12.5px;
    color: var(--ink-2);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  footer b { color: var(--ink); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }


/* ---- freshness strip ---- */

/* Hairline grid over a ruled background, same construction as .tiles, so the
   two read as one family rather than two panels that happen to sit together. */
.sources {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-radius: 3px;
  overflow: hidden;
}

.src {
  background: var(--surface);
  padding: 11px 13px;
  display: grid;
  grid-template-columns: 7px 1fr;
  gap: 3px 8px;
  align-items: baseline;
}

/* The dot is the fast read; the word next to the date is the one that
   survives a colourblind reader or a monochrome print. */
.src .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  align-self: center;
  background: var(--aqua);
}
.src[data-s="late"] .dot { background: var(--orange); }
.src[data-s="stale"] .dot,
.src[data-s="missing"] .dot { background: var(--pos-exit-bg); }
.src[data-s="unused"] .dot { background: var(--ink-3); }
.src[data-s="stale"], .src[data-s="missing"] { background: var(--surface-alt); }

.src .slabel {
  font-size: 10.5px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 600;
}
.src .sdate {
  grid-column: 2;
  font-family: var(--mono);
  font-size: 13.5px;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.src .sage { grid-column: 2; font-size: 11.5px; color: var(--ink-2); }
.src[data-s="stale"] .sage,
.src[data-s="missing"] .sage { color: var(--orange); font-weight: 600; }
.src[data-s="unused"] .sage { color: var(--ink-3); }

/* ---- card grid ---- */

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
  gap: 16px;
  align-items: start;
}

.card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 3px;
  display: flex;
  flex-direction: column;
}
/* The move stream is the reason to open the page, so it gets the full width
   and the leaderboard shares the row underneath the holder cards. */
.card-wide { grid-column: 1 / -1; }

/* An un-ingested manager or the watchlist: a slot the registry knows about
   with no book behind it yet, kept visually distinct from a card with data. */
.card.ghost { border-style: dashed; background: transparent; }
.card.ghost .cardhead { border-bottom-style: dashed; }
.card.ghost h2 { color: var(--ink-2); }

/* Title and link on one row, the hint on its own underneath: in a card three
   across, a hint sharing the row pushes the link onto a second line and the
   three headers stop lining up. */
.cardhead {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 3px 16px;
  align-items: baseline;
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--rule);
}
.cardhead h2 { font-size: 17px; }
.cardhead .hint { grid-column: 1 / -1; }
.cardhead a {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--accent);
  text-decoration: none;
  white-space: nowrap;
}
.cardhead a:hover { text-decoration: underline; }

.cardbody { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.cardfoot {
  margin-top: auto;
  padding: 10px 18px 12px;
  border-top: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}

/* ---- holder badges ---- */

/* Whose row this is. ARK gets its own accent because it is the one holder
   that reports daily; every filer shares one neutral style rather than each
   getting a colour of its own, so a newly ingested manager needs no CSS. */
.holder {
  font-family: var(--mono); font-size: 10.5px; font-weight: 600;
  padding: 2px 7px; border-radius: 2px; white-space: nowrap;
  background: var(--surface-alt); color: var(--ink-2);
  border: 1px solid var(--rule-strong);
}
.holder[data-h="ark"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.holder[data-h="watchlist"] { background: transparent; color: var(--ink-3); border-style: dashed; }

/* Who else, besides the row's own holder, also has this ticker -- a small
   inline mark distinct from .holder so the eye can tell "whose row this is"
   from "who else is in it" at a glance. */
.alsopill {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  padding: 1px 6px; border-radius: 999px; white-space: nowrap;
  background: var(--surface-alt); color: var(--ink-2); opacity: 0.85;
}
.alsopill[data-h="ark"] { background: var(--accent-soft); color: var(--accent); }

/* ---- the cross-holder move stream ---- */

/* Grouped by cadence rather than merged by size or time: a season's exit and
   a day's add are not commensurable, so the groups say so instead of forcing
   one ranking onto both. */
.streamgroup + .streamgroup { border-top: 1px solid var(--rule); }
.streamgroup-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 12px 18px 8px; flex-wrap: wrap;
}
.streamgroup-head .sgtitle { display: flex; align-items: baseline; gap: 9px; }
.streamgroup-head .sgtitle b { font-size: 13.5px; }
.streamgroup-head .sgtitle span { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.streamgroup-head .sgtally { display: flex; gap: 6px; flex-wrap: wrap; }

.stream { display: flex; flex-direction: column; }
.srow {
  display: grid;
  grid-template-columns: 78px minmax(0, 1fr) auto;
  gap: 4px 14px;
  align-items: baseline;
  padding: 9px 18px;
  border-top: 1px solid var(--rule);
  text-decoration: none;
  color: inherit;
}
.streamgroup-head + .stream .srow:first-child { border-top: none; }
.srow:hover { background: var(--surface-alt); }
.srow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
/* Agreement is the ordering inside ARK's own group, so it gets the one strong mark. */
.srow.agree { box-shadow: inset 3px 0 0 var(--accent); }

.srow .who { min-width: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.srow .tick { font-family: var(--mono); font-weight: 600; font-size: 13px; }
.srow .co {
  font-size: 12.5px;
  color: var(--ink-2);
  display: inline-block;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  vertical-align: bottom;
}
.srow .tail {
  display: flex;
  align-items: baseline;
  gap: 16px;
  font-family: var(--mono);
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
}
.srow .val { min-width: 68px; text-align: right; }
.srow .agreecount { color: var(--ink-2); font-size: 11.5px; min-width: 70px; }
.srow.agree .agreecount { color: var(--accent); font-weight: 600; }

@media (max-width: 700px) {
  .srow { grid-template-columns: max-content minmax(0, 1fr); padding: 10px 14px; }
  .srow .tag-action { grid-row: 1 / 3; align-self: center; }
  .srow .tail { grid-column: 1 / -1; justify-content: flex-start; margin-top: 2px; }
  .srow .val { min-width: 0; text-align: left; }
}

/* ---- a holder's book ---- */

.headline {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.headline .big {
  font-family: var(--mono);
  font-size: clamp(24px, 5vw, 30px);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.headline .sub { font-size: 12.5px; color: var(--ink-2); }

.fundsplit { display: flex; flex-direction: column; gap: 6px; }
.fundrow {
  display: grid;
  grid-template-columns: 56px minmax(60px, 1fr) 72px 42px;
  gap: 10px;
  align-items: center;
  font-family: var(--mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.fundrow .fname { font-weight: 600; }
.fundrow .ftrack { height: 6px; border-radius: 3px; background: var(--surface-alt); }
.fundrow .fbar { display: block; height: 6px; border-radius: 3px; background: var(--bar); }
.fundrow .fval { text-align: right; color: var(--ink-2); }
.fundrow .fpct { text-align: right; color: var(--ink-3); }

@media (max-width: 400px) {
  .fundrow { grid-template-columns: 48px minmax(40px, 1fr) 66px; }
  .fundrow .fpct { display: none; }
}

/* ---- leaders ---- */

.ranklist { display: flex; flex-direction: column; }
.rankrow {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr) auto;
  gap: 4px 12px;
  align-items: baseline;
  padding: 7px 0;
  border-bottom: 1px solid var(--rule);
  font-size: 13px;
}
.ranklist .rankrow:last-child { border-bottom: none; }
.rankrow .rk {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.rankrow .rname { min-width: 0; display: flex; gap: 7px; align-items: baseline; flex-wrap: wrap; }
.rankrow .tick { font-family: var(--mono); font-weight: 600; }
.rankrow .co {
  font-size: 12px;
  color: var(--ink-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rankrow .rtail { display: flex; align-items: center; gap: 7px; justify-content: flex-end; }
.rankrow .rmove {
  font-family: var(--mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.rmove[data-d="up"] { color: var(--aqua); }
.rmove[data-d="down"] { color: var(--orange); }
.rankrow .rcap { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }

.turnover { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  font-family: var(--mono);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 2px;
  background: var(--surface-alt);
  color: var(--ink-2);
  white-space: nowrap;
}
.pill b { color: var(--ink); font-weight: 600; }

@media (max-width: 620px) {
  .wrap { padding: 24px 14px 56px; gap: 22px; }
  .cardhead, .cardbody { padding-left: 14px; padding-right: 14px; }
  .cardfoot { padding-left: 14px; padding-right: 14px; }
  .streamgroup-head { padding: 12px 14px 8px; }
}

const LANGS = DATA.langs.map(l => l.v);
let lang = (() => {
  try { const v = localStorage.getItem('ark-lang'); if (LANGS.includes(v)) return v; }
  catch (e) {}
  return LANGS[0];
})();
const page = () => DATA.i18n[lang];
const t = k => page().ui[k];
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? '');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

function money(v) {
  const a = Math.abs(v);
  const [div, suf] = a >= 1e12 ? [1e12, 'T'] : a >= 1e9 ? [1e9, 'B']
    : a >= 1e6 ? [1e6, 'M'] : a >= 1e3 ? [1e3, 'K'] : [1, ''];
  return (v < 0 ? '-$' : '$') + (a / div).toFixed(a / div >= 100 ? 0 : 1) + suf;
}

const HERE = 'index';
/* The shared site nav, inlined into every page by shell.py.

   Labels come from page().nav so they follow the language switch, and each
   template declares its own `HERE` so the current page can be marked rather
   than dropped -- a missing entry reads as a broken link, not as "you are
   here".

   The newest report is served both as holdings.html and as its dated copy
   under reports/, from the same bytes, so the depth cannot be baked into the
   href; it is read off the path instead. */

const NAV_BASE = location.pathname.includes('/reports/') ? '../' : '';
const NAV_PAGES = ['index', 'leaders', 'manager', 'archive'];

function paintNav() {
  const el = document.getElementById('sitenav');
  if (!el) return;
  const labels = page().nav || {};
  el.innerHTML = NAV_PAGES.map(k =>
    `<a href="${NAV_BASE}${k}.html"${k === HERE ? ' aria-current="page"' : ''}>` +
    `${labels[k] || k}</a>`).join('');
}


const ARROW = {new: '▲', buy: '▲', sell: '▼', exit: '▼'};

const FILERS = Object.entries(DATA.filers);
const HOLDER_LABEL = {ark: 'ARK'};
FILERS.forEach(([k, f]) => { HOLDER_LABEL[k] = f.short; });

// Every registered holder of one ticker: ARK's whole book plus every ingested
// filer's, not just the handful that happen to appear in a top-N slice.
function holdersOf(ticker) {
  const out = [];
  if (DATA.arkWeights[ticker]) out.push({h: 'ark', w: DATA.arkWeights[ticker].w});
  FILERS.forEach(([k, f]) => { if (f.weights && f.weights[ticker]) out.push({h: k, w: f.weights[ticker].w}); });
  return out;
}

const alsoPills = (ticker, exclude) => holdersOf(ticker)
  .filter(x => x.h !== exclude)
  .map(x => `<span class="alsopill" data-h="${x.h}">${esc(fill(t('also'), {label: HOLDER_LABEL[x.h], w: x.w.toFixed(1)}))}</span>`)
  .join('');

function quarterOf(d) {
  const [y, m] = d.split('-');
  return `${y} Q${Math.ceil(+m / 3)}`;
}

/* ---- freshness ---- */

function paintSources() {
  const names = page().sources;
  const rows = DATA.sources.map(s => {
    const age = s.status === 'missing' ? t('never')
      : s.status === 'unused' ? t('unused')
      : s.behind === 0 ? t('ok')
      : fill(t((s.unit === 'sessions' ? 'session' : 'day') + (s.behind === 1 ? 'Behind' : 'sBehind')), {n: s.behind});
    return {status: s.status, label: names[s.k] || s.k, date: s.date, age};
  });
  DATA.thirteenf.forEach(r => rows.push({
    status: r.status, label: `13F · ${r.label}`, date: r.date,
    age: r.status === 'missing' ? t('never') : fill(t('quartersOnFile'), {n: r.quarters}),
  }));
  document.getElementById('sources').innerHTML = rows.map(r => `<div class="src" data-s="${r.status}">
    <span class="dot"></span>
    <span class="slabel">${esc(r.label)}</span>
    <span class="sdate">${esc(r.date || '—')}</span>
    <span class="sage">${esc(r.age)}</span>
  </div>`).join('');
}

/* ---- cards ---- */

// Link before hint: the header is a grid, and the hint spans both columns, so
// anything after it lands on a row of its own.
const head = (title, hint, href, linkText) => `
  <div class="cardhead">
    <h2>${esc(title)}</h2>
    ${href ? `<a href="${NAV_BASE}${href}" aria-label="${esc(title)}">${esc(linkText)}</a>` : ''}
    ${hint ? `<span class="hint">${esc(hint)}</span>` : ''}
  </div>`;

function srow(holder, href, e, cadenceTail, agree) {
  return `<a class="srow${agree ? ' agree' : ''}" href="${NAV_BASE}${href}">
    <span class="tag-action" data-k="${e.k}"><span class="arrow">${ARROW[e.k]}</span>${esc(t(e.k))}</span>
    <span class="who"><span class="tick">${esc(e.t || '—')}</span>
      <span class="co">${esc(e.n)}</span>${alsoPills(e.t, holder)}</span>
    <span class="tail">
      <span class="val">${e.v ? money(e.v) : '—'}</span>
      <span class="agreecount">${esc(cadenceTail)}</span>
    </span>
  </a>`;
}

function moveGroup(headline, tally, rowsHTML) {
  const chips = tally ? `<div class="sgtally">
      <span class="pill">${esc(t('new'))} <b>${tally.new}</b></span>
      <span class="pill">${esc(t('buy'))} <b>${tally.buy}</b></span>
      <span class="pill">${esc(t('sell'))} <b>${tally.sell}</b></span>
      <span class="pill">${esc(t('exit'))} <b>${tally.exit}</b></span>
    </div>` : '';
  return `<div class="streamgroup">
    <div class="streamgroup-head"><div class="sgtitle">${headline}</div>${chips}</div>
    <div class="stream">${rowsHTML}</div>
  </div>`;
}

function paintMoves() {
  const el = document.getElementById('card-moves');
  const groups = [];

  const a = DATA.moves;
  if (a) {
    const rows = a.items.map(e => srow('ark', 'activity.html', e,
      fill(t('movesAgree'), {n: e.f.length}), e.f.length >= a.conviction)).join('');
    groups.push(moveGroup(`<b>ARK</b><span>${esc(fill(t('sessionHead'), {d: a.date}))}</span>`, a.tally, rows));
  }

  FILERS.forEach(([key, f]) => {
    if (!f.moves) return;
    const q = quarterOf(f.moves.date);
    const rows = f.moves.items.map(e => srow(key, `${key}/activity.html`, e, q, false)).join('');
    groups.push(moveGroup(
      `<b>${esc(f.short)}</b><span>${esc(fill(t('quarterHead'), {q}))}</span>`, f.moves.tally, rows));
  });

  if (!groups.length) {
    el.innerHTML = head(t('moves'), '', '', '') +
      `<div class="cardbody"><span class="hint">${esc(t('empty'))}</span></div>`;
    return;
  }
  el.innerHTML = head(t('moves'), t('movesHint'), '', '') + groups.join('');
}

function arkCard() {
  const b = DATA.book;
  const max = Math.max(...b.funds.map(f => f.v), 1);
  const bars = b.funds.filter(f => f.v > 0).map(f => `<div class="fundrow">
    <span class="fname">${esc(f.f)}</span>
    <span class="ftrack"><span class="fbar" style="width:${(f.v / max * 100).toFixed(1)}%"></span></span>
    <span class="fval">${money(f.v)}</span>
    <span class="fpct">${(f.v / b.total * 100).toFixed(0)}%</span></div>`).join('');
  const tl = DATA.moves ? DATA.moves.tally : null;
  return `<section class="card">
    ${head('ARK Invest', t('arkSub'), 'holdings.html', '→')}
    <div class="cardbody">
      <div class="headline"><span class="big">${money(b.total)}</span>
        <span class="holder" data-h="ark">${esc(t('cadenceDaily'))}</span>
        <span class="sub">${b.n} ${esc(t('bookSymbols'))}</span></div>
      ${tl ? `<div class="turnover">
        <span class="pill">${esc(t('new'))} <b>${tl.new}</b></span>
        <span class="pill">${esc(t('buy'))} <b>${tl.buy}</b></span>
        <span class="pill">${esc(t('sell'))} <b>${tl.sell}</b></span>
        <span class="pill">${esc(t('exit'))} <b>${tl.exit}</b></span>
      </div>` : ''}
      <div class="fundsplit">${bars}</div>
    </div>
    <div class="cardfoot">${b.date} · ${esc(fill(t('archived'), {n: DATA.sessions}))}</div>
  </section>`;
}

function filerCard(key, f) {
  const rows = f.top.slice(0, 4).map(c => `<div class="rankrow">
    <span class="rk">${c.w.toFixed(1)}%</span>
    <span class="rname"><span class="tick">${esc(c.t || '—')}</span>
      <span class="co">${esc(c.n)}</span>${alsoPills(c.t, key)}</span>
    <span class="rcap">${money(c.v)}</span></div>`).join('');
  return `<section class="card">
    ${head(f.label, `13F · ${t('cadenceQuarterly')}`, `${key}/activity.html`, '→')}
    <div class="cardbody">
      <div class="headline"><span class="big">${money(f.total)}</span>
        <span class="holder" data-h="${key}">${esc(t('cadenceQuarterly'))}</span>
        <span class="sub">${f.n} ${esc(t('positionsWord'))}</span></div>
      ${f.prevPeriod ? `<div class="turnover">
        <span class="pill">${esc(t('new'))} <b>${f.opened}</b></span>
        <span class="pill">${esc(t('exit'))} <b>${f.closed}</b></span>
        ${f.unidentified ? `<span class="pill">${esc(t('unidentWord'))} <b>${f.unidentified}</b></span>` : ''}
      </div>` : ''}
      <div class="ranklist">${rows}</div>
    </div>
    <div class="cardfoot">${esc(fill(t('asOfQuarter'), {d: f.period}))} · ${esc(fill(t('quartersArchived'), {n: f.quarters}))}</div>
  </section>`;
}

function ghostCard(key, m) {
  return `<section class="card ghost">
    ${head(m.label, fill(t('notIngestedHint'), {cik: m.cik}), '', '')}
    <div class="cardbody"><span class="hint">${esc(fill(t('notIngestedBody'), {name: key}))}</span></div>
    <div class="cardfoot">${esc(t('notIngestedFoot'))}</div>
  </section>`;
}

function watchlistCard() {
  return `<section class="card ghost">
    ${head(t('watchlist'), t('watchlistSub'), '', '')}
    <div class="cardbody"><span class="hint">${esc(t('watchlistBody'))}</span></div>
    <div class="cardfoot">${esc(t('watchlistFoot'))}</div>
  </section>`;
}

function paintHolderCards() {
  document.getElementById('holdercards').innerHTML =
    arkCard()
    + FILERS.map(([k, f]) => filerCard(k, f)).join('')
    + Object.entries(DATA.known).map(([k, m]) => ghostCard(k, m)).join('')
    + watchlistCard();
}

function paintLeaders() {
  const l = DATA.leaders;
  const el = document.getElementById('card-leaders');
  if (!l) {
    el.innerHTML = head(t('leaders'), '', '', '') +
      `<div class="cardbody"><span class="hint">${esc(t('empty'))}</span></div>`;
    return;
  }
  // With movement to show, movement is the story; without it, the ranking is.
  const moved = l.moved.length > 0;
  const rows = (moved ? l.moved : l.top).map(c => {
    const marks = holdersOf(c.t).map(h =>
      `<span class="holder" data-h="${h.h}">${esc(HOLDER_LABEL[h.h])}</span>`).join('');
    return `<div class="rankrow">
      <span class="rk">#${c.r}</span>
      <span class="rname"><span class="tick">${esc(c.t)}</span>
        <span class="co">${esc(c.n)}</span></span>
      <span class="rtail">${marks}
        ${moved
          ? `<span class="rmove" data-d="${c.d > 0 ? 'up' : 'down'}">${c.d > 0 ? '▲' : '▼'} ${Math.abs(c.d)}</span>`
          : `<span class="rcap">${money(c.cap)}</span>`}</span>
    </div>`;
  }).join('');

  const turnover = l.prevDate ? `<div class="turnover">
      <span class="pill">${esc(t('leadersIn'))} <b>${l.in.length}</b></span>
      <span class="pill">${esc(t('leadersOut'))} <b>${l.out.length}</b></span>
      <span class="pill">${esc(fill(t('leadersHeld'), {n: l.held}))}</span>
    </div>` : `<span class="hint">${esc(t('leadersFirst'))}</span>`;

  el.innerHTML = head(t('leaders'), t('leadersHint'), 'leaders.html', '→')
    + `<div class="cardbody">${turnover}<div class="ranklist">${rows}</div></div>`
    + `<div class="cardfoot">${esc(fill(t('leadersCutoff'), {v: (l.cutoff / 1e9).toFixed(0)}))}  ·  ${l.date}</div>`;
}

/* ---- shell ---- */

const switcher = document.getElementById('langswitch');
switcher.innerHTML = DATA.langs.map(l =>
  `<button type="button" data-l="${l.v}" aria-pressed="false">${l.label}</button>`).join('');
switcher.addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b || b.dataset.l === lang) return;
  lang = b.dataset.l;
  try { localStorage.setItem('ark-lang', lang); } catch (err) {}
  render();
});

function paintProvenance() {
  const bits = [`ARK ${DATA.asOf}`, `${page().sources.leaders} ${DATA.leaders.date}`,
    ...FILERS.map(([, f]) => `${f.short} ${f.period}`)];
  document.getElementById('provenance').textContent = bits.join('  ·  ');
}

function render() {
  const c = page();
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = c.title;
  document.getElementById('eyebrow').textContent = c.eyebrow;
  document.getElementById('title').textContent = c.title;
  document.getElementById('standfirst').textContent = c.standfirst;
  document.getElementById('h-sources').textContent = t('sources');
  document.getElementById('hint-sources').textContent = t('sourcesHint');
  document.getElementById('footnotes').innerHTML = c.footnotes
    .map(([b, x]) => `<div>${b ? `<b>${esc(b)}</b> ` : ''}${esc(x)}</div>`).join('');
  switcher.querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.l === lang ? 'true' : 'false'));

  paintNav();
  paintProvenance();
  paintSources();
  paintMoves();
  paintHolderCards();
  paintLeaders();
}

render();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>13F filings</title>

<style>
  :root {
    color-scheme: light;
    --ground:      #f4f6f8;
    --surface:     #ffffff;
    --surface-alt: #eef1f4;
    --ink:         #151a1f;
    --ink-2:       #5a646e;
    --ink-3:       #8b959f;
    --rule:        #dde2e7;
    --rule-strong: #c4ccd4;
    --accent:      #2a78d6;
    --accent-soft: #dfebfa;
    --violet:      #4a3aa7;
    --orange:      #c04f22;
    --aqua:        #157f5a;
    --bar:         #b9d3f0;
    /* Trade direction. Three redundant encodings, because at 10.5px hue alone
       does not separate: fill vs tint for intensity, hue for direction, and an
       arrow glyph that works with no colour at all. */
    --pos-new-bg:  #0b6b46;  --pos-new-fg:  #ffffff;
    --pos-buy-bg:  #d5eee2;  --pos-buy-fg:  #0a5c3c;
    --pos-sell-bg: #fbe0d2;  --pos-sell-fg: #8c3813;
    --pos-exit-bg: #9c3a18;  --pos-exit-fg: #ffffff;
    --pos1-bg: #12508f;  --pos1-fg: #ffffff;
    --pos2-bg: #2f6fb8;  --pos2-fg: #ffffff;
    --pos3-bg: #b9d5f0;  --pos3-fg: #123a63;
    --pos4-bg: #e7eef5;  --pos4-fg: #4a5560;

    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans:  ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono:  ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground:      #101418;
      --surface:     #171c21;
      --surface-alt: #1e242a;
      --ink:         #e9edf1;
      --ink-2:       #9aa5af;
      --ink-3:       #6d7883;
      --rule:        #262d34;
      --rule-strong: #3a434c;
      --accent:      #3987e5;
      --accent-soft: #1b2c42;
      --violet:      #9085e9;
      --orange:      #e0763f;
      --aqua:        #35b98a;
      --bar:         #2c4d73;
      --pos-new-bg:  #35b98a;  --pos-new-fg:  #06231a;
      --pos-buy-bg:  #1b4234;  --pos-buy-fg:  #7fe0b6;
      --pos-sell-bg: #4a2818;  --pos-sell-fg: #f0a077;
      --pos-exit-bg: #e0763f;  --pos-exit-fg: #1c0d05;

      --pos1-bg: #6aa9ea;  --pos1-fg: #0b1620;
      --pos2-bg: #2f6fb8;  --pos2-fg: #ffffff;
      --pos3-bg: #27435f;  --pos3-fg: #cfe0f2;
      --pos4-bg: #232a31;  --pos4-fg: #8a949e;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground:      #101418;
    --surface:     #171c21;
    --surface-alt: #1e242a;
    --ink:         #e9edf1;
    --ink-2:       #9aa5af;
    --ink-3:       #6d7883;
    --rule:        #262d34;
    --rule-strong: #3a434c;
    --accent:      #3987e5;
    --accent-soft: #1b2c42;
    --violet:      #9085e9;
    --orange:      #e0763f;
    --aqua:        #35b98a;
    --bar:         #2c4d73;
    --pos1-bg: #6aa9ea;  --pos1-fg: #0b1620;
    --pos2-bg: #2f6fb8;  --pos2-fg: #ffffff;
    --pos3-bg: #27435f;  --pos3-fg: #cfe0f2;
    --pos4-bg: #232a31;  --pos4-fg: #8a949e;
    --pos-new-bg:  #35b98a;  --pos-new-fg:  #06231a;
    --pos-buy-bg:  #1b4234;  --pos-buy-fg:  #7fe0b6;
    --pos-sell-bg: #4a2818;  --pos-sell-fg: #f0a077;
    --pos-exit-bg: #e0763f;  --pos-exit-fg: #1c0d05;
  }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* ---- masthead ---- */

  .masthead { display: flex; flex-direction: column; gap: 10px; }

  .masthead-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .langswitch { display: flex; gap: 0; }
  .langswitch button {
    font: inherit;
    font-size: 12px;
    font-family: var(--mono);
    /* Two characters wide, and it must stay that way: on a narrow screen the
       nav takes the row and "中文" would otherwise break across two lines. */
    white-space: nowrap;
    padding: 5px 11px;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    cursor: pointer;
  }
  .langswitch button:first-child { border-radius: 3px 0 0 3px; }
  .langswitch button:last-child { border-radius: 0 3px 3px 0; border-left: none; }
  .langswitch button[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
    font-weight: 600;
  }
  .langswitch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---- site nav ---- */

  /* Every page carries the same nav, so the current page is marked rather than
     omitted -- a missing item reads as a broken link, not as "you are here". */
  .sitenav { display: flex; flex-wrap: wrap; gap: 4px; }
  .sitenav a {
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 11px;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    text-decoration: none;
    white-space: nowrap;
  }
  .sitenav a:hover { border-color: var(--accent); color: var(--ink); }
  .sitenav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sitenav a[aria-current="page"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
    font-weight: 600;
  }

  /* ---- trade direction chip ---- */

  /* Shared by the feed and the home page. Solid for opening and closing,
     tinted for adding and trimming: the fill carries intensity, the hue
     carries direction, and the arrow works with no colour at all. */
  .tag-action {
    justify-self: start;
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .tag-action[data-k="new"]  { background: var(--pos-new-bg);  color: var(--pos-new-fg); }
  .tag-action[data-k="buy"]  { background: var(--pos-buy-bg);  color: var(--pos-buy-fg); }
  .tag-action[data-k="sell"] { background: var(--pos-sell-bg); color: var(--pos-sell-fg); }
  .tag-action[data-k="exit"] { background: var(--pos-exit-bg); color: var(--pos-exit-fg); }
  .tag-action .arrow { font-size: 9px; opacity: 0.85; }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
  }

  h1 {
    font-family: var(--serif);
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 600;
    line-height: 1.12;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }

  .standfirst {
    color: var(--ink-2);
    max-width: 62ch;
    margin: 0;
    font-size: 14.5px;
  }

  .provenance {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-3);
    border-top: 1px solid var(--rule);
    padding-top: 10px;
    margin-top: 4px;
  }

  /* ---- summary tiles ---- */

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 3px;
    overflow: hidden;
  }

  .tile {
    background: var(--surface);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .tile-label {
    font-size: 10.5px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
  }

  .tile-value {
    font-family: var(--mono);
    font-size: 21px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .tile-note { font-size: 12px; color: var(--ink-2); }

  /* ---- fund strip ---- */

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  h2 {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 600;
    margin: 0;
  }

  .hint { font-size: 12.5px; color: var(--ink-3); }

  .scroller { overflow-x: auto; }

  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }

  thead th {
    text-align: left;
    font-size: 10.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
    padding: 9px 12px;
    border-bottom: 1px solid var(--rule-strong);
    white-space: nowrap;
    background: var(--surface);
  }

  tbody td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule);
    vertical-align: baseline;
  }

  .num {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
    white-space: nowrap;
  }

  .fundtable {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    max-width: 660px;
  }
  .fundtable td:first-child, .fundtable th:first-child { padding-left: 18px; }
  .fundtable td:last-child, .fundtable th:last-child { padding-right: 18px; }
  .fundtable tbody tr:last-child td { border-bottom: none; font-weight: 600; }
  .fundtable tbody tr:last-child td { border-top: 1px solid var(--rule-strong); }
  .ticker-cell { font-family: var(--mono); font-weight: 600; }

  /* ---- controls ---- */

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  .search {
    flex: 1 1 220px;
    min-width: 180px;
    font: inherit;
    font-size: 14px;
    padding: 8px 12px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
  }
  .search::placeholder { color: var(--ink-3); }
  .search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .chipset { display: flex; flex-wrap: wrap; gap: 6px; }

  .filterbar {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .filter-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .filter-groups {
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-top: 1px solid var(--rule);
    padding-top: 12px;
  }

  .filter-row {
    display: grid;
    grid-template-columns: 116px 1fr;
    gap: 12px;
    align-items: start;
  }

  .filter-label {
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
    padding-top: 7px;
  }

  .chip .count {
    color: var(--ink-3);
    font-weight: 400;
    margin-left: 5px;
  }
  .chip[aria-pressed="true"] .count { color: var(--ink-2); }
  .chip[data-empty="1"] { opacity: 0.4; }

  .clear {
    font: inherit;
    font-size: 12px;
    padding: 6px 10px;
    color: var(--ink-2);
    background: transparent;
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    cursor: pointer;
  }
  .clear:hover { border-color: var(--accent); color: var(--ink); }
  .clear:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  @media (max-width: 720px) {
    .filter-row { grid-template-columns: 1fr; gap: 4px; }
    .filter-label { padding-top: 0; }
  }

  .chip {
    font: inherit;
    font-size: 12px;
    font-family: var(--mono);
    padding: 6px 10px;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--ink); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chip[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
    font-weight: 600;
  }

  /* ---- holdings table ---- */

  /* A capped height makes the container the vertical scroller, which is what
     the sticky header sticks to; without it `top: 0` has nothing to act on. */
  .holdings-wrap {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    overflow: auto;
    max-height: 74vh;
  }

  #holdings { font-size: 13px; min-width: 1190px; }
  #holdings thead th { position: sticky; top: 0; z-index: 2; }
  #holdings th.sortable { cursor: pointer; user-select: none; }
  #holdings th.sortable:hover { color: var(--ink); }
  #holdings th.sortable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #holdings th .arrow { opacity: 0; margin-left: 3px; }
  #holdings th[data-dir] .arrow { opacity: 1; color: var(--accent); }
  #holdings td:first-child, #holdings th:first-child { padding-left: 18px; }
  #holdings td:last-child, #holdings th:last-child { padding-right: 18px; }

  .row-main { cursor: pointer; }
  .row-main:hover { background: var(--surface-alt); }
  .row-main:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row-main.open { background: var(--surface-alt); }

  /* Enough columns now that the browser would rather wrap the name than
     scroll; a floor keeps it on one or two lines and lets the wrapper scroll. */
  .name-cell { min-width: 236px; max-width: 340px; }
  .name { display: block; }
  .cusip {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
  }

  /* magnitude bar sits behind the value, anchored to the right edge */
  .mv-cell { position: relative; }
  .mv-inner {
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 8px;
  }

  /* Order-of-magnitude badge on ARK's position. A single hue stepped
     light-to-dark, because size is ordinal -- categorical colours would imply
     these tiers are unrelated kinds rather than a scale. The tier is spelled
     out on the badge so it never depends on colour alone. */
  .mv-tier {
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1.5;
    letter-spacing: 0.02em;
    padding: 1px 5px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .mv-tier[data-t="p1"] { background: var(--pos1-bg); color: var(--pos1-fg); }
  .mv-tier[data-t="p2"] { background: var(--pos2-bg); color: var(--pos2-fg); }
  .mv-tier[data-t="p3"] { background: var(--pos3-bg); color: var(--pos3-fg); }
  .mv-tier[data-t="p4"] { background: var(--pos4-bg); color: var(--pos4-fg); }

  .mv-bar {
    position: absolute;
    right: 12px;
    bottom: 3px;
    height: 3px;
    border-radius: 0 0 0 0;
    background: var(--bar);
  }
  .mv-val { position: relative; }

  .tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.03em;
    padding: 2px 6px;
    border-radius: 2px;
    border: 1px solid currentColor;
    white-space: nowrap;
  }
  .tag[data-i="0"] { color: var(--ink-3); }
  .tag[data-i="1"] { color: var(--violet); }
  .tag[data-i="2"] { color: var(--orange); }
  .tag[data-i="3"] { color: var(--aqua); }

  .price-cell { font-family: var(--mono); font-variant-numeric: tabular-nums;
                text-align: right; white-space: nowrap; }

  /* 52-week range: a track spanning low..high with the last price marked. */
  .range { display: flex; flex-direction: column; gap: 3px; min-width: 104px; }
  .range-track {
    position: relative;
    height: 4px;
    border-radius: 2px;
    background: var(--rule-strong);
  }
  .range-mark {
    position: absolute;
    top: -2px;
    width: 3px;
    height: 8px;
    border-radius: 1px;
    background: var(--accent);
    transform: translateX(-1.5px);
  }
  .range-ends {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-3);
    gap: 8px;
  }

  .funds-cell { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }

  .detail td { background: var(--surface-alt); border-bottom: 1px solid var(--rule-strong); }
  .detail-desc {
    margin: 0;
    /* Fills the detail row instead of wrapping three times in a narrow column,
       but stays under the table's min-width: an auto-layout table grows to fit
       its widest cell, so an unbounded line here stretches the whole table and
       pushes the last columns out of view. */
    max-width: 1080px;
    padding-right: 24px;
    font-size: 13.5px;
    /* Chinese needs the looser leading; it reads cramped at English spacing. */
    line-height: 1.7;
    color: var(--ink);
    /* Stops a one-word last line -- "software." was orphaning on its own row. */
    text-wrap: pretty;
    line-break: strict;
    overflow-wrap: break-word;
  }

  .detail-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.02em;
  }

  .detail-body {
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 10px 0 12px;
  }

  .detail-links { display: flex; flex-wrap: wrap; gap: 6px; }
  .detail-links a {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 8px;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    text-decoration: none;
    white-space: nowrap;
  }
  .detail-links a:hover { border-color: var(--accent); color: var(--accent); }
  .detail-links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .detail-links a::after { content: " ↗"; opacity: 0.45; }

  .fin-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 22px;
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
  }
  .fin-row b { color: var(--ink); font-weight: 600; }
  .fin-row .neg { color: var(--orange); }
  .fin-row .warn { color: var(--ink-3); font-style: italic; }

  .detail-inner {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 22px;
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .detail-inner span { color: var(--ink-2); }
  .detail-inner b { color: var(--ink); font-weight: 600; }

  .empty { padding: 28px 18px; color: var(--ink-2); font-size: 14px; }

  .status {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }

  footer {
    border-top: 1px solid var(--rule);
    padding-top: 16px;
    font-size: 12.5px;
    color: var(--ink-2);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  footer b { color: var(--ink); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }


/* ---- manager book ---- */

#book { font-size: 13px; min-width: 940px; }
#book thead th { position: sticky; top: 0; z-index: 2; }
#book th.sortable { cursor: pointer; user-select: none; }
#book th.sortable:hover { color: var(--ink); }
#book th.sortable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#book th .arrow { opacity: 0; margin-left: 3px; }
#book th[data-dir] .arrow { opacity: 1; color: var(--accent); }
#book td:first-child, #book th:first-child { padding-left: 18px; }
#book td:last-child, #book th:last-child { padding-right: 18px; }

.w-cell { position: relative; }
/* Weight gets a track behind the number rather than its own column: the bar
   is a magnitude the eye reads first, the number is the one it reads second. */
.w-track {
  position: absolute;
  right: 12px;
  bottom: 4px;
  height: 3px;
  border-radius: 2px;
  background: var(--bar);
}

.spark { display: block; overflow: visible; }
.spark .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.spark .now { fill: var(--accent); }
.spark .base { stroke: var(--rule-strong); stroke-width: 1; }

.held-cell { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.since-cell { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }

/* ---- expanded history ---- */

/* The shared site nav, inlined into every page by shell.py.

   Labels come from page().nav so they follow the language switch, and each
   template declares its own `HERE` so the current page can be marked rather
   than dropped -- a missing entry reads as a broken link, not as "you are
   here".

   The newest report is served both as holdings.html and as its dated copy
   under reports/, from the same bytes, so the depth cannot be baked into the
   href; it is read off the path instead. */

const NAV_BASE = location.pathname.includes('/reports/') ? '../' : '';
const NAV_PAGES = ['index', 'holdings', 'activity', 'leaders', 'manager', 'archive'];

function paintNav() {
  const el = document.getElementById('sitenav');
  if (!el) return;
  const labels = page().nav || {};
  el.innerHTML = NAV_PAGES.map(k =>
    `<a href="${NAV_BASE}${k}.html"${k === HERE ? ' aria-current="page"' : ''}>` +
    `${labels[k] || k}</a>`).join('');
}


const lbl = o => (lang === 'zh' && o.label_zh) ? o.label_zh : o.label;
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? '');
const usd = n => n.toLocaleString('en-US', {maximumFractionDigits: 0});
function money(v) {
  const a = Math.abs(v);
  const [d, u] = a >= 1e9 ? [1e9, 'B'] : a >= 1e6 ? [1e6, 'M'] : a >= 1e3 ? [1e3, 'K'] : [1, ''];
  return '$' + (a / d).toFixed(a / d >= 100 ? 0 : 1) + u;
}

const Q = DATA.quarters;
const HEADS = {t: 'colTicker', n: 'colCompany', w: 'colWeight', v: 'colValue',
               held: 'colHeld', since: 'colSince'};

const state = {q: '', sort: 'w', dir: -1, open: new Set()};

const visible = () => DATA.holdings.filter(h => !state.q ||
  ((h.t || '') + ' ' + h.n).toLowerCase().includes(state.q));

/* ---- sparkline: shape over time, one row's own scale ---- */

function spark(h) {
  const W = 104, H = 22, pad = 2;
  const peak = Math.max(...h.h.map(p => p[1])) || 1;
  const x = i => pad + (Q.length > 1 ? i / (Q.length - 1) : 0) * (W - 2 * pad);
  const y = w => H - pad - (w / peak) * (H - 2 * pad);
  // Gaps are quarters with no filing line, and they are not zero -- the
  // segment is simply not drawn across them.
  const runs = [];
  let cur = [];
  h.h.forEach(([i, w]) => {
    if (cur.length && i !== cur[cur.length - 1][0] + 1) { runs.push(cur); cur = []; }
    cur.push([i, w]);
  });
  if (cur.length) runs.push(cur);
  const paths = runs.map(r =>
    `<path class="line" d="${r.map(([i, w], k) =>
      `${k ? 'L' : 'M'}${x(i).toFixed(1)},${y(w).toFixed(1)}`).join('')}"/>`).join('');
  const last = h.h[h.h.length - 1];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"
    role="img" aria-label="${esc(fill(t('quartersHeld'), {n: h.held, d: h.first}))}">
    <line class="base" x1="0" y1="${H - 1}" x2="${W}" y2="${H - 1}"/>
    ${paths}
    <circle class="now" cx="${x(last[0]).toFixed(1)}" cy="${y(last[1]).toFixed(1)}" r="2.5"/>
  </svg>`;
}

/* ---- expanded history: one column per reported quarter ---- */

function chart(h) {
  const W = 900, H = 132, left = 34, right = 8, top = 10, bot = 22;
  const peak = Math.max(...h.h.map(p => p[1])) || 1;
  const step = (W - left - right) / Q.length;
  const bw = Math.max(2, step - 2);           // 2px surface gap between marks
  const y = w => top + (1 - w / peak) * (H - top - bot);
  const bars = h.h.map(([i, w, v, s]) => {
    const bx = left + i * step;
    const by = y(w);
    return `<rect class="bar" data-i="${i}" x="${bx.toFixed(1)}" y="${by.toFixed(1)}"
      width="${bw.toFixed(1)}" height="${(H - bot - by).toFixed(1)}" rx="1.5"/>
      <rect class="hit" data-i="${i}" data-w="${w}" data-v="${v}" data-s="${s}"
      x="${bx.toFixed(1)}" y="${top}" width="${step.toFixed(1)}" height="${H - bot - top}"/>`;
  }).join('');
  const ticks = [0, peak / 2, peak].map(v =>
    `<line class="grid" x1="${left}" y1="${y(v).toFixed(1)}" x2="${W - right}" y2="${y(v).toFixed(1)}"/>
     <text class="ylab" x="${left - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${v.toFixed(1)}%</text>`
  ).join('');
  // Only the ends and the midpoint are labelled: fifty-two quarter labels
  // would collide into a grey band and say nothing.
  const marks = [0, Math.floor(Q.length / 2), Q.length - 1].map(i =>
    `<text class="xlab" x="${(left + i * step + bw / 2).toFixed(1)}" y="${H - 6}"
      text-anchor="middle">${Q[i]}</text>`).join('');
  return `<div class="chart" data-c="${h.c}">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${ticks}${bars}
      <line class="zero" x1="${left}" y1="${H - bot}" x2="${W - right}" y2="${H - bot}"/>
      ${marks}
    </svg>
    <div class="tip" hidden></div>
  </div>`;
}

const SITE_LABEL = {};
(DATA.sites || []).forEach(x => { SITE_LABEL[x.key] = x; });
const siteLinks = h => !h.lk ? '' :
  `<div class="detail-links">${h.lk.map(l => {
    const s = SITE_LABEL[l.k];
    return s ? `<a href="${l.u}" target="_blank" rel="noopener noreferrer">${lbl(s)}</a>` : '';
  }).join('')}</div>`;

function detail(h) {
  const peak = Math.max(...h.h.map(p => p[1]));
  return `<tr class="detail"><td colspan="7"><div class="hist">
    <div class="hist-head">
      <span>${esc(t('historyOf'))} · <b>${esc(fill(t('peak'), {w: peak.toFixed(2)}))}</b></span>
      <span>${esc(fill(t('quartersHeld'), {n: h.held, d: h.first}))}</span>
    </div>
    ${chart(h)}
    <div class="detail-inner">
      <span>${esc(t('colShares'))} <b>${usd(h.s)}</b></span>
      <span>${esc(t('colValue'))} <b>${money(h.v)}</b></span>
      <span>${esc(t('colWeight'))} <b>${h.w.toFixed(2)}%</b></span>
    </div>
    ${siteLinks(h)}
  </div></td></tr>`;
}

function render() {
  const rows = visible();
  const dir = state.dir, key = state.sort;
  rows.sort((a, b) => {
    const x = a[key], y = b[key];
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * dir;
  });
  const maxW = Math.max(...DATA.holdings.map(h => h.w), 1);

  document.getElementById('rows').innerHTML = rows.map(h => {
    const open = state.open.has(h.c);
    return `<tr class="row-main${open ? ' open' : ''}" data-c="${h.c}"
        tabindex="0" role="button" aria-expanded="${open}">
      <td class="ticker-cell">${esc(h.t || '—')}</td>
      <td class="name-cell"><span class="name">${esc(h.n)}</span>
        ${h.t ? '' : `<span class="cusip">${esc(t('unidentified'))}</span>`}</td>
      <td class="num w-cell">${h.w.toFixed(2)}%
        <span class="w-track" style="width:${(h.w / maxW * 46).toFixed(1)}px"></span></td>
      <td class="num">${money(h.v)}</td>
      <td>${spark(h)}</td>
      <td class="num held-cell">${h.held}</td>
      <td class="since-cell">${h.since}</td>
    </tr>${open ? detail(h) : ''}`;
  }).join('');

  const shown = rows.reduce((a, h) => a + h.v, 0);
  document.getElementById('status').textContent = fill(t('status'), {
    n: rows.length, t: DATA.holdings.length,
    p: (shown / DATA.total * 100).toFixed(0)});
  document.getElementById('empty').hidden = rows.length > 0;
  document.querySelectorAll('#book th[data-key]').forEach(th => {
    if (th.dataset.key === key) th.dataset.dir = dir > 0 ? 'up' : 'down';
    else delete th.dataset.dir;
  });
}

function paintStatic() {
  const c = page();
  paintNav();
  document.getElementById('eyebrow').textContent = c.eyebrow;
  document.getElementById('title').textContent = c.title;
  document.getElementById('standfirst').textContent = c.standfirst;
  document.getElementById('provenance').textContent = c.provenance;
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = c.title;

  document.getElementById('tiles').innerHTML = c.tiles.map(([l, v, n]) => `
    <div class="tile"><span class="tile-label">${l}</span>
      <span class="tile-value">${v}</span><span class="tile-note">${n}</span></div>`).join('');
  document.getElementById('footnotes').innerHTML = c.footnotes
    .map(([b, x]) => `<div>${b ? `<b>${b}</b> ` : ''}${x}</div>`).join('');

  document.getElementById('h-book').textContent = t('book');
  document.getElementById('hint-book').textContent = t('bookHint');
  document.getElementById('h-exits').textContent = t('exits');
  document.getElementById('hint-exits').textContent =
    fill(t('exitsHint'), {n: 8});
  document.getElementById('hd-hist').textContent = t('colHistory');
  document.getElementById('search').placeholder = t('search');
  document.getElementById('clear').textContent = t('clear');
  document.getElementById('empty').textContent = t('empty');
  document.querySelectorAll('#book .hd').forEach(el => {
    el.textContent = t(HEADS[el.dataset.t]);
  });

  const ex = document.getElementById('exits');
  ex.innerHTML = DATA.exits.map(e => `
    <div class="exit">
      <span class="who"><span class="tick">${esc(e.t || '—')}</span>
        <span class="co">${esc(e.n)}</span></span>
      <span class="meta">${money(e.v)} · ${e.w.toFixed(2)}% · ${esc(fill(t('lastSeen'), {d: e.last}))}</span>
    </div>`).join('');
  document.getElementById('exits-section').hidden = DATA.exits.length === 0;
}

/* ---- events ---- */

document.getElementById('search').addEventListener('input', ev => {
  state.q = ev.target.value.trim().toLowerCase();
  document.getElementById('clear').hidden = !state.q;
  render();
});
document.getElementById('clear').addEventListener('click', () => {
  state.q = '';
  document.getElementById('search').value = '';
  document.getElementById('clear').hidden = true;
  render();
});

document.querySelectorAll('#book th[data-key]').forEach(th => {
  const go = () => {
    const k = th.dataset.key;
    if (state.sort === k) state.dir = -state.dir;
    else { state.sort = k; state.dir = (k === 't' || k === 'n' || k === 'since') ? 1 : -1; }
    render();
  };
  th.addEventListener('click', go);
  th.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
  });
});

function toggle(row) {
  const c = row.dataset.c;
  if (state.open.has(c)) state.open.delete(c); else state.open.add(c);
  render();
}
const body = document.getElementById('rows');
body.addEventListener('click', ev => {
  const row = ev.target.closest('.row-main');
  if (row && !ev.target.closest('a')) toggle(row);
});
body.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  const row = ev.target.closest('.row-main');
  if (row) { ev.preventDefault(); toggle(row); }
});

// Hover on the history chart. The hit rectangles span the full column height,
// so the target is the quarter rather than the bar's own few pixels.
body.addEventListener('mousemove', ev => {
  const hit = ev.target.closest('.hit');
  const wrap = ev.target.closest('.chart');
  if (!wrap) return;
  const tip = wrap.querySelector('.tip');
  if (!hit) { tip.hidden = true; return; }
  const i = +hit.dataset.i;
  // The bar for a quarter precedes its hit rectangle, so the highlight cannot
  // be a CSS sibling rule; it is set here instead.
  wrap.querySelectorAll('.bar.on').forEach(b => b.classList.remove('on'));
  const bar = wrap.querySelector(`.bar[data-i="${i}"]`);
  if (bar) bar.classList.add('on');
  tip.innerHTML = `<span class="q">${Q[i]}</span>
    ${esc(t('tooltipWeight'))} <b>${(+hit.dataset.w).toFixed(2)}%</b><br>
    ${esc(t('tooltipValue'))} <b>${money(+hit.dataset.v)}</b><br>
    ${esc(t('tooltipShares'))} <b>${usd(+hit.dataset.s)}</b>`;
  tip.hidden = false;
  const box = wrap.getBoundingClientRect();
  const x = ev.clientX - box.left;
  tip.style.left = Math.min(Math.max(x + 12, 0), box.width - tip.offsetWidth - 4) + 'px';
  tip.style.top = '4px';
});
body.addEventListener('mouseleave', () => {
  document.querySelectorAll('.tip').forEach(x => { x.hidden = true; });
  document.querySelectorAll('.bar.on').forEach(b => b.classList.remove('on'));
}, true);

const switcher = document.getElementById('langswitch');
switcher.innerHTML = DATA.langs.map(l =>
  `<button type="button" data-l="${l.v}" aria-pressed="false">${l.label}</button>`).join('');
switcher.addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b || b.dataset.l === lang) return;
  lang = b.dataset.l;
  try { localStorage.setItem('ark-lang', lang); } catch (err) {}
  switcher.querySelectorAll('button').forEach(x =>
    x.setAttribute('aria-pressed', x.dataset.l === lang ? 'true' : 'false'));
  paintStatic();
  render();
});
switcher.querySelectorAll('button').forEach(x =>
  x.setAttribute('aria-pressed', x.dataset.l === lang ? 'true' : 'false'));

paintStatic();
render();
</script>

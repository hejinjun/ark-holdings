language: zh-CN

reviews:
  profile: chill
  high_level_summary: true
  walkthrough: true
  poem: false
  path_instructions:
    - path: "**/*.vue"
      instructions: |
        按 Vue 组件和 H5/小程序场景审查：确认定时器、事件监听、订阅、观察器及页面级资源在组件卸载或页面隐藏时正确清理，避免内存泄漏；检查异步请求的取消、竞态处理、重复提交防护、错误处理，以及组件卸载后是否仍会更新状态；关注按需加载、依赖引入、图片和字体资源、分包边界及小程序主包体积；确认使用的 API 与目标端兼容，并留意 XSS、敏感信息暴露和无障碍问题。避免仅凭推测报告问题。
    - path: "**/*.tsx"
      instructions: |
        按 React H5/小程序场景审查：检查 effect 的依赖、清理函数，以及定时器、事件监听、订阅和观察器的释放，避免内存泄漏；检查异步请求的取消与竞态处理、重复提交防护、错误处理，以及卸载后更新状态的风险；关注按需加载、依赖引入、图片和字体资源、分包边界及小程序主包体积；确认使用的 API 与目标端兼容，并留意 XSS、敏感信息暴露和无障碍问题。避免仅凭推测报告问题。
    - path: "**/*.jsx"
      instructions: |
        按 React H5/小程序场景审查：检查 effect 的依赖、清理函数，以及定时器、事件监听、订阅和观察器的释放，避免内存泄漏；检查异步请求的取消与竞态处理、重复提交防护、错误处理，以及卸载后更新状态的风险；关注按需加载、依赖引入、图片和字体资源、分包边界及小程序主包体积；确认使用的 API 与目标端兼容，并留意 XSS、敏感信息暴露和无障碍问题。避免仅凭推测报告问题。
    - path: "**/*.ts"
      instructions: |
        审查前端及 Taro 逻辑：检查定时器、事件监听、订阅和观察器是否在生命周期结束时清理；检查异步请求的取消、竞态与错误处理；关注不必要的依赖和全量导入、代码分割、分包配置及小程序主包体积；确认多端 API 和条件编译使用正确，避免未经验证的端兼容性假设。避免仅凭推测报告问题。
    - path: "**/*.js"
      instructions: |
        审查前端及 Taro 逻辑：检查定时器、事件监听、订阅和观察器是否在生命周期结束时清理；检查异步请求的取消、竞态与错误处理；关注不必要的依赖和全量导入、代码分割、分包配置及小程序主包体积；确认多端 API 和条件编译使用正确，避免未经验证的端兼容性假设。避免仅凭推测报告问题。
    - path: "**/*.html"
      instructions: |
        审查页面结构、响应式布局、语义化与无障碍；检查动态内容是否安全地转义以防 XSS，外部资源及链接是否安全；关注重复或过大的资源、阻塞渲染的脚本，以及页面是否会遗留事件监听或定时任务。不要将静态页面误判为框架应用。
